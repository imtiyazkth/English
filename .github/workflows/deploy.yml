name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  tutor:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GK: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy api --project-ref "$REF" --no-verify-jwt
      - run: supabase secrets set GEMINI_API_KEY="$GK" GEMINI_MODEL=gemini-3.1-flash-lite --project-ref "$REF"
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
        env:
          VITE_API_BASE: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: d
        uses: actions/deploy-pages@v4
